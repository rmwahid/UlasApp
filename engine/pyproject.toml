[project]
name = "ulasapp-engine"
version = "0.1.0"
description = "Local pipeline engine for UlasApp review videos"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "python-multipart>=0.0.20",
    "sqlmodel>=0.0.24",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
